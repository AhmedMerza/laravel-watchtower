name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependency-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A sparse cover of PHP 8.2-8.4 x Laravel 11-13, rather than the full
        # grid: every PHP and every Laravel major appears twice, and both ends
        # of the supported range get a prefer-lowest run against their own
        # floor. Laravel 13 requires PHP >=8.3, so it never pairs with 8.2.
        include:
          - php: '8.2'
            laravel: '11'
            dependency-version: prefer-lowest
          - php: '8.2'
            laravel: '12'
            dependency-version: prefer-stable
          - php: '8.3'
            laravel: '11'
            dependency-version: prefer-stable
          - php: '8.3'
            laravel: '13'
            dependency-version: prefer-lowest
          - php: '8.4'
            laravel: '12'
            dependency-version: prefer-stable
          - php: '8.4'
            laravel: '13'
            dependency-version: prefer-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      # Pins the major under test; testbench is left to composer.json, so the
      # version it picks is one this package actually declares support for.
      - name: Pin the Laravel major
        run: composer require "laravel/framework:${{ matrix.laravel }}.*" --no-interaction --no-update
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Check code style
        run: vendor/bin/pint --test
