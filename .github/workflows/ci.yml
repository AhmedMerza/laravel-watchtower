name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependency-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every PHP x Laravel pair the package supports, plus a prefer-lowest
        # run at each end of the range. Laravel 13 requires PHP >=8.3, so it
        # never pairs with 8.2.
        #
        # prefer-lowest installs 12.61.1 and 13.12.0, not the declared ^12.0 and
        # ^13.0 floors: Composer refuses a release with an open security
        # advisory, and every earlier one in both majors is affected. The floor
        # CI can reach is the advisory floor, and it moves when a new advisory
        # lands.
        include:
          - php: '8.2'
            laravel: '12'
            dependency-version: prefer-lowest
          - php: '8.2'
            laravel: '12'
            dependency-version: prefer-stable
          - php: '8.3'
            laravel: '12'
            dependency-version: prefer-stable
          - php: '8.3'
            laravel: '13'
            dependency-version: prefer-lowest
          - php: '8.4'
            laravel: '12'
            dependency-version: prefer-stable
          - php: '8.4'
            laravel: '13'
            dependency-version: prefer-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      # Pins the major under test; testbench is left to composer.json, so the
      # version it picks is one this package actually declares support for.
      - name: Pin the Laravel major
        run: composer require "laravel/framework:${{ matrix.laravel }}.*" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    name: Static analysis (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHPStan's verdict is major-sensitive — Laravel 13 narrowed
        # getGlobalMiddleware()'s PHPDoc, which is why the TrustProxies lookup
        # in the service provider carries no is_string() guard. With no
        # committed lockfile an unpinned `composer install` analyses whichever
        # major resolves as newest, so a break specific to an older one would
        # never surface. Cover both instead.
        laravel: ['12', '13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Pin the Laravel major
        run: composer require "laravel/framework:${{ matrix.laravel }}.*" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # The README promises every Laravel major composer.json permits is exercised
  # by CI. Widening the illuminate/* constraint without adding matrix rows would
  # make that silently false, so fail the build instead. jq and yq ship on
  # ubuntu-latest; no composer install needed.
  supported-majors:
    name: Supported Laravel majors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every permitted major has a matrix row
        run: |
          set -euo pipefail
          ci=.github/workflows/ci.yml

          constraints=$(jq -r '.require | to_entries[] | select(.key | startswith("illuminate/")) | .value' composer.json | sort -u)
          if [ -z "$constraints" ]; then
            echo "::error file=composer.json::No illuminate/* package in composer.json's require, so there is no Laravel range to check. Update this check in $ci."
            exit 1
          fi
          if [ "$(wc -l <<<"$constraints")" -ne 1 ]; then
            echo "::error file=composer.json::The illuminate/* constraints in composer.json disagree: $(paste -sd ' ' <<<"$constraints"). Give every illuminate/* package the same range."
            exit 1
          fi

          majors=()
          for part in $(tr '|' ' ' <<<"$constraints"); do
            if [[ $part =~ ^[~^]?([0-9]+)(\.[0-9*]+)*$ ]]; then
              majors+=("${BASH_REMATCH[1]}")
            else
              echo "::error file=composer.json::Can't expand '$part' (in illuminate/* '$constraints') to a single Laravel major. Use ^N.0 terms or update this check in $ci."
              exit 1
            fi
          done

          failed=0
          for job in tests static-analysis; do
            if [ "$job" = tests ]; then
              rows=$(yq '.jobs.tests.strategy.matrix.include[].laravel' "$ci")
            else
              rows=$(yq '.jobs.static-analysis.strategy.matrix.laravel[]' "$ci")
            fi
            for major in "${majors[@]}"; do
              if ! grep -qx "$major" <<<"$rows"; then
                echo "::error file=$ci::composer.json permits Laravel $major (illuminate/* '$constraints') but the $job matrix in $ci has no laravel: '$major' row. Add one, or narrow the range in composer.json."
                failed=1
              fi
            done
          done
          [ "$failed" -eq 0 ] && echo "Laravel ${majors[*]} each have a tests and static-analysis row."
          exit "$failed"

  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Check code style
        run: vendor/bin/pint --test
